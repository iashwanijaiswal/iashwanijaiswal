<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="230">
  <defs>
    <!-- Background Space / Cyber Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b14"/>
      <stop offset="50%" stop-color="#071a2f"/>
      <stop offset="100%" stop-color="#02060d"/>
    </linearGradient>

    <!-- Animated Flowing Text Gradient (Continuous Shimmer) -->
    <linearGradient id="animatedNameGrad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="25%" stop-color="#0077FE"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="75%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0077FE"/>
      <animate attributeName="x1" from="0%" to="-100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" from="200%" to="100%" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00D4FF" flood-opacity="0.15"/>
    </filter>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 6px;
      fill: url(#animatedNameGrad);
      filter: url(#neonGlow);
    }
    .badge-label {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.5px;
      fill: #00D4FF;
    }
    .sub-headline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 2px;
      fill: #94A3B8;
    }
    .grid-line {
      stroke: #00D4FF;
      stroke-opacity: 0.07;
      stroke-width: 1;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="900" height="230" rx="18" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" filter="url(#cardShadow)" />

  <!-- Subtle Cyber Matrix Grid Background -->
  <line x1="0" y1="58" x2="900" y2="58" class="grid-line" />
  <line x1="0" y1="115" x2="900" y2="115" class="grid-line" />
  <line x1="0" y1="172" x2="900" y2="172" class="grid-line" />
  <line x1="150" y1="0" x2="150" y2="230" class="grid-line" />
  <line x1="300" y1="0" x2="300" y2="230" class="grid-line" />
  <line x1="450" y1="0" x2="450" y2="230" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="230" class="grid-line" />
  <line x1="750" y1="0" x2="750" y2="230" class="grid-line" />

  <!-- Status Capsule Badge -->
  <g transform="translate(450, 42)">
    <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#0A2540" stroke="#00D4FF" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="-140" cy="0" r="4.5" fill="#00D4FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text text-anchor="middle" y="4" class="badge-label">AZURE DEVOPS &amp; DEVSECOPS</text>
  </g>

  <!-- Animated Glowing Name -->
  <text x="450" y="122" text-anchor="middle" class="name-title">ASHWANI JAISWAL</text>

  <!-- Subtitle -->
  <text x="450" y="168" text-anchor="middle" class="sub-headline">Cloud Architecture • Shift-Left DevSecOps • Terraform &amp; CI/CD</text>

  <!-- Animated Neon Accent Underline -->
  <rect x="350" y="194" width="200" height="2.5" rx="1.5" fill="url(#animatedNameGrad)" />
</svg>
